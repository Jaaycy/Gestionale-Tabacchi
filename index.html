<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabby">
<meta name="theme-color" content="#0d141d">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tabby</title>
<style>
:root{color-scheme:dark;--blu:#2a74c9;--acc:#7db7f5;--ink:#e8eef6;--mute:#93a3b6;--line:#243245;--bg:#0d141d;--card:#152031;--ok:#4cc38a;--ko:#ff7b72;--r:18px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:17px/1.4 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 50% -12%,rgba(70,130,215,.24),transparent 62%),radial-gradient(70% 40% at 105% 105%,rgba(76,195,138,.07),transparent 70%)}
main{max-width:560px;margin:0 auto;padding:0 16px 24px}
main.enter{animation:in .38s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font-size:31px;font-weight:800;letter-spacing:-.02em;margin:22px 2px 14px;color:var(--acc);background:linear-gradient(95deg,#cfe5ff,#7db7f5 55%,#9d9cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:12.5px;margin:24px 6px 8px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60px),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:2px 16px;box-shadow:0 10px 28px -14px rgba(0,0,0,.7)}
.pad{padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);margin:0;width:100%}
.card>.row:last-child,.card>div:last-child .row:last-child{border-bottom:0}
.row input{width:46%;text-align:right;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);padding:5px 8px;border-radius:10px;outline:0;transition:background .2s,box-shadow .2s}
.row input::placeholder{color:#5d6d80;font-weight:400}
.row input:focus{background:rgba(125,183,245,.1);box-shadow:inset 0 0 0 1.5px rgba(125,183,245,.55)}
.row input.l{text-align:left;width:62%;font-weight:400}
.sub span{color:var(--mute);padding-left:14px}
.old span,.old input{color:var(--mute)}.old em{font-style:normal;font-size:12px;margin-left:6px;padding:1px 7px;border:1px solid var(--line);border-radius:9px}
.tg{flex:1;display:flex;align-items:center;gap:8px;font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left}
.tg::after{content:"›";font-size:22px;line-height:1;color:var(--mute);transition:transform .28s var(--ease)}
.tg[aria-expanded=true]::after{transform:rotate(90deg)}
.cl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.cl.open{grid-template-rows:1fr}
.cl>div{overflow:hidden;min-height:0;opacity:0;transition:opacity .25s}
.cl.open>div{opacity:1}
.ok,.ok b{color:var(--ok)}.ko,.ko b{color:var(--ko)}
.btn{display:inline-block;font:inherit;font-weight:650;border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(180deg,#4a95e8,#2a6fc4);color:#fff;margin:6px 6px 0 0;box-shadow:0 8px 18px -8px rgba(42,116,201,.8),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .14s var(--ease),filter .14s}
.btn:active,.seg button:active,nav button:active,.ln:active{transform:scale(.96)}
.btn:active{filter:brightness(1.1)}
.ghost{background:rgba(125,183,245,.07);color:var(--acc);border:1px solid rgba(125,183,245,.35);box-shadow:none}
.acts{display:flex;gap:10px;margin-top:20px}.acts .btn{margin:0;padding:15px 18px}.acts #save{flex:1}
.x{font:inherit;border:0;background:none;color:var(--ko);padding:4px}
.mute{color:var(--mute);font-size:15px;margin:8px 0}
.seg{display:flex;gap:4px;margin-bottom:12px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.seg button{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:600;padding:8px 4px;border:0;background:none;border-radius:12px;color:var(--mute);transition:background .25s,color .25s,transform .14s}
.seg button.on{background:linear-gradient(180deg,#4a95e8,#2a6fc4);color:#fff;box-shadow:0 4px 12px -4px rgba(42,116,201,.8)}
.nav2{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.nav2 button{font:inherit;font-size:22px;line-height:1;border:0;background:rgba(125,183,245,.08);color:var(--acc);width:42px;height:42px;border-radius:50%;transition:transform .14s}
.nav2 button:active{transform:scale(.9)}
.nav2 b{text-transform:capitalize;font-size:18px}
.hero{padding:16px 18px 14px;margin-bottom:12px}
.hero .hl{font-size:13px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:4px 0 8px}
.big small{font-size:20px;font-weight:700;color:var(--mute)}
.hs{font-size:14px;color:var(--mute);margin-top:4px}
.chip{display:inline-block;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(147,163,182,.14);color:var(--ink);margin-right:4px}
.chip.up{background:rgba(76,195,138,.15);color:var(--ok)}.chip.dn{background:rgba(255,123,114,.15);color:var(--ko)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--mute);font-weight:600;text-align:right;padding:10px 0}th:first-child{text-align:left}
td{padding:9px 0;border-top:1px solid var(--line)}td+td{text-align:right;font-variant-numeric:tabular-nums}
tr.s td{font-weight:700}
td small,th small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
td+td{white-space:nowrap;padding-left:8px}td.v{font-size:14px;font-weight:600}td.up{color:var(--ok)}td.dn{color:var(--ko)}
.ln{background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;transition:transform .14s}
.pill{flex:none;font-size:14px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(147,163,182,.14);color:var(--mute);white-space:nowrap}
.pill.ok{background:rgba(76,195,138,.16);color:var(--ok)}.pill.ko{background:rgba(255,123,114,.16);color:var(--ko)}
.qb{display:flex;align-items:center;gap:14px;margin:12px 0 4px;padding:14px;border-radius:14px;background:rgba(147,163,182,.1);border:1px solid rgba(147,163,182,.18)}
.qb i{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-style:normal;font-size:24px;font-weight:800;background:rgba(147,163,182,.2);color:var(--mute)}
.qb b{display:block;font-size:26px;line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
.qb span{font-size:14px;line-height:1.35;color:var(--mute)}.qb .qt{display:block;margin-top:4px}
.qb.ok{background:rgba(76,195,138,.12);border-color:rgba(76,195,138,.35)}.qb.ok i{background:var(--ok);color:#0d141d}.qb.ok b{color:var(--ok)}
.qb.ko{background:rgba(255,123,114,.12);border-color:rgba(255,123,114,.35)}.qb.ko i{background:var(--ko);color:#0d141d}.qb.ko b{color:var(--ko)}
.row.tot b{font-size:20px}
.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:24px;background:rgba(24,36,53,.72);-webkit-backdrop-filter:saturate(170%) blur(20px);backdrop-filter:saturate(170%) blur(20px);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px -10px rgba(0,0,0,.65)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11.5px;font-weight:600;border:0;background:none;padding:8px 2px 7px;border-radius:18px;color:var(--mute);transition:background .25s,color .25s,transform .14s}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
nav button.on{color:var(--acc);background:rgba(125,183,245,.15)}
nav button.on svg{transform:translateY(-1px) scale(1.08)}
#t{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:rgba(43,58,78,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);font-weight:600;padding:11px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 26px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .25s,transform .35s var(--ease);pointer-events:none;white-space:nowrap}
#t.on{opacity:1;transform:translate(-50%,0)}
.ch{padding:12px 10px 6px}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.ch text{fill:var(--mute);font-size:10px;font-variant-numeric:tabular-nums}
.ch .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.ch .b0{fill:#4f6178}.ch .b1{fill:url(#gb1)}
.ch .b0,.ch .b1{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.ch .hit{fill:transparent;transition:fill .2s}.ch .hit.sel{fill:rgba(125,183,245,.14)}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mute);margin:2px 4px 6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg .s0{background:#4f6178}.lg .s1{background:var(--acc)}
#ci{margin:6px 4px 4px;font-size:14px;min-height:2.8em}
#ci b{color:var(--ink);font-weight:600}
.ph{display:none}
.rt th,.rt td+td{text-align:center}.rt th:first-child{text-align:left}.rt th{padding:10px 4px}
.hbr{padding:14px 16px 10px}
.hr{margin:10px 0 12px}.hr:last-child{margin-bottom:4px}
.hn{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}.hn b{font-weight:600;white-space:nowrap}
.hb{display:flex;align-items:center;gap:8px;height:12px;margin:3px 0}.hb small{font-size:12px;color:var(--mute);white-space:nowrap}
.hb i{display:block;height:100%;min-width:0;border-radius:4px;transform-origin:0 50%;animation:growx .7s var(--ease) both}
.hb .b1{background:linear-gradient(90deg,#4f97e6,#a9d2ff)}.hb .b0{background:#4f6178}
@keyframes growx{from{transform:scaleX(0)}}
.hq{margin-top:8px;font-size:14px;font-weight:700}.hq.ok{color:var(--ok)}.hq.ko{color:var(--ko)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 16px}
.tw table{font-size:14px;min-width:100%}
.tw th,.tw td{white-space:nowrap;padding-left:10px}.tw th:first-child,.tw td:first-child{padding-left:0}
.tw td:first-child{position:sticky;left:0;background:var(--card);padding-right:8px}
.tw th{vertical-align:bottom;white-space:normal;min-width:64px;font-size:13px}
.tw td.z{color:var(--mute)}
.ph small{display:block;font-size:11pt;font-weight:400}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{:root{color-scheme:light;--ink:#000;--mute:#444;--line:#bbb;--bg:#fff;--card:#fff;--acc:#000}*{animation:none!important;box-shadow:none!important}body::before{display:none}nav,.noprint,#t{display:none!important}.ph{display:block;font-weight:700;font-size:20px;margin:0 0 10px}body{background:#fff;padding:0;font-size:12pt}.card{border:0;padding:0;background:#fff}h1{display:none}.hero{margin:0 0 10px}.big{font-size:22pt}.chip{background:none!important;padding:0}.ch .b1{fill:#000}.ch .b0,.lg .s0{fill:#bbb;background:#bbb}.ch .hit.sel{fill:transparent}.lg i,.hb i{-webkit-print-color-adjust:exact;print-color-adjust:exact}.hb .b1{background:#000}.hb .b0{background:#bbb}.tw{overflow:visible;padding:0}.tw table{font-size:8.5pt}.tw th{font-size:8pt;min-width:0}.tw th,.tw td{padding:3px 0 3px 6px}.tw td:first-child{position:static}h2{color:#000;margin:14pt 0 4pt;break-after:avoid;text-transform:none;letter-spacing:0;font-size:12pt}table{break-inside:avoid}}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-v="chiusura"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Chiusura</button>
<button data-v="riepilogo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><rect x="5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="6" width="3" height="11" rx="1"/><rect x="16" y="9" width="3" height="8" rx="1"/></svg>Riepilogo</button>
<button data-v="impostazioni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg>Reparti e backup</button>
</nav>
<div id="t"></div>
<script>
const K='tabacchi.v1',$=s=>document.querySelector(s);
const c2=x=>Math.round((x||0)*100)/100;
// Importo con punto delle migliaia sempre presente (anche 1.234,56) e 2 decimali; ng = segno meno da usare
const grp=(x,ng='−')=>{x=c2(x);const[i,d]=Math.abs(x).toFixed(2).split('.');return(x<0?ng:'')+i.replace(/\B(?=(\d{3})+$)/g,'.')+','+d};
const eur=n=>grp(n)+' €';
// Importo grande: centesimi e simbolo € più piccoli
const bigEur=n=>{const s=grp(n),k=s.length-3;return `${s.slice(0,k)}<small>${s.slice(k)} €</small>`};
// Il punto è separatore delle migliaia; ma se c'è un solo punto seguito da 1 o 2 cifre (es. 12.50, tastiera col punto) è il decimale
const num=s=>{s=String(s).trim();const n=parseFloat(/^-?\d*\.\d{1,2}$/.test(s)?s:s.replace(/\./g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*100)/100};
// Testo incollato con punto e virgola insieme: l'ultimo dei due è il decimale (1,234.56 e 1.234,56 = 1234,56)
const pasted=v=>{const p=v.lastIndexOf('.'),c=v.lastIndexOf(',');return p>=0&&c>=0&&p>c?v.replace(/,/g,'').replace(/\.(?=[^.]*$)/,',').replace(/\./g,''):v};
const fi=n=>n==null||n===''?'':grp(n,'-');
const clean=v=>{v=v.replace(/[^0-9.,-]/g,'');const neg=v[0]==='-',i=v.indexOf(','),a=(i<0?v:v.slice(0,i)).replace(/-/g,'');return(neg?'-':'')+a+(i<0?'':','+v.slice(i+1).replace(/[.,-]/g,'').slice(0,2))};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// true se il nome appartiene a un reparto eliminato che ha ancora importi registrati
const hasData=n=>!db.reparti.includes(n)&&Object.values(db.days).some(r=>r.rep&&n in r.rep);
const init=()=>({reparti:['Tabacchi','Gratta e vinci','Lotto','Valori bollati','Ricariche','Altro'],fondo:0,days:{}});
let db;try{db=JSON.parse(localStorage.getItem(K))||init()}catch(e){db=init()}
// Salva in memoria; se non riesce mostra solo l'errore, torna ai dati davvero salvati e restituisce false
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){
 alert('Salvataggio NON riuscito: la memoria del telefono è piena o bloccata. Le ultime modifiche non sono state salvate.\n\nFai subito un backup da «Reparti e backup» e libera spazio sul telefono.');
 try{db=JSON.parse(localStorage.getItem(K))||init()}catch(_){}return false}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
// Giorno della chiusura proposto: oggi; fino alle 3 di notte il giorno prima (chiusure dopo mezzanotte)
const oggi=()=>{const d=new Date();d.setHours(d.getHours()-3);return iso(d)};
const oggiD=()=>new Date(oggi()+'T12:00');
let todayK=oggi(),cfOpen=true,view='chiusura',cur=todayK,mode='giorno',anchor=oggiD(),chart=null,selB=-1,repY=new Date().getFullYear(),lastView=null,lastQ=null,tT;
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800)}
// Vibrazione leggera: Android usa navigator.vibrate; su iPhone (iOS 18 o successivo) si usa il trucco dell'interruttore nascosto
let hapL;function hap(){try{if(navigator.vibrate){navigator.vibrate(15);return}
 if(!hapL){hapL=document.createElement('label');hapL.style.display='none';hapL.setAttribute('aria-hidden','true');hapL.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hapL)}
 hapL.click()}catch(e){}}

function vChiusura(){
 const r=db.days[cur]||{},rp=r.rep||{};
 const rep=db.reparti.map(n=>`<label class="row"><span>${esc(n)}</span><input data-r="${esc(n)}" inputmode="decimal" placeholder="0,00" value="${fi(rp[n])}"></label>`).join('')
  // reparti eliminati che hanno un importo in questa chiusura: compaiono in grigio, restano nella quadratura e nel salvataggio
  +Object.keys(rp).filter(n=>!db.reparti.includes(n)).map(n=>`<label class="row old"><span>${esc(n)}<em>eliminato</em></span><input data-r="${esc(n)}" inputmode="decimal" placeholder="0,00" value="${fi(rp[n])}"></label>`).join('');
 return `<div class="hd"><h1>Chiusura</h1><span class="pill" id="qp"></span></div>
 <div class="card"><label class="row"><span>Data</span><input id="d" type="date" value="${cur}"></label></div>
 <h2>Cassa</h2><div class="card">
  <div class="row"><button class="tg" id="tg" aria-expanded="${cfOpen}">Contanti</button><input id="c" aria-label="Contanti" inputmode="decimal" placeholder="0,00" value="${fi(r.c)}"></div>
  <div id="cf" class="cl${cfOpen?' open':''}"${cfOpen?'':' inert'}><div><label class="row sub"><span>Fondo cassa</span><input id="f" inputmode="decimal" placeholder="0,00" value="${fi(r.f!=null?r.f:db.fondo)}"></label></div></div>
  <label class="row"><span>POS</span><input id="pos" inputmode="decimal" placeholder="0,00" value="${fi(r.pos)}"></label>
  <label class="row"><span>Satispay</span><input id="sat" inputmode="decimal" placeholder="0,00" value="${fi(r.sat)}"></label></div>
 <h2>Incassi per reparto</h2><div class="card">${rep}</div>
 <h2>Quadratura</h2><div class="card" id="q"></div>
 <div class="acts"><button class="btn" id="save">Salva chiusura</button>${db.days[cur]?'<button class="btn ghost" id="del">Elimina</button>':''}</div>`}

function read(){const g=s=>num(($(s)||{}).value),rep={};
 document.querySelectorAll('[data-r]').forEach(i=>{if(i.value.trim()!=='')rep[i.dataset.r]=num(i.value)});
 return{c:g('#c'),f:g('#f'),pos:g('#pos'),sat:g('#sat'),rep}}
function calc(){const q=$('#q');if(!q)return;
 const r=read(),tr=Object.values(r.rep).reduce((a,b)=>a+b,0),el=r.pos+r.sat,inc=r.c+el,d=Math.round((inc-tr)*100)/100;
 // stato: e = nessun importo inserito, ok = quadra, ko = differenza
 const st=!r.c&&!r.pos&&!r.sat&&!Object.keys(r.rep).length?'e':d===0?'ok':'ko';
 const pop=lastQ!==null&&lastQ!==st?' pop':'';lastQ=st;
 const badge=st==='e'?`<div class="qb e"><i>€</i><div><b>Quadratura</b><span>Inserisci gli importi per vedere la quadratura.</span></div></div>`
  :st==='ok'?`<div class="qb ok${pop}"><i>✓</i><div><b>Quadra ✓</b><span>I conti tornano: l'incassato corrisponde ai reparti.</span></div></div>`
  :`<div class="qb ko${pop}"><i>!</i><div><span>Differenza</span><b>${eur(d)}</b><span class="qt">${d>0?`Avanzano ${eur(d)}: hai incassato più di quanto battuto. Forse un reparto non inserito o il fondo cassa contato nei contanti.`:`Mancano ${eur(-d)}: hai incassato meno di quanto battuto. Controlla resti dati, contanti contati o un pagamento non segnato.`}</span></div></div>`;

function rng(m,a){const s=new Date(a.getFullYear(),a.getMonth(),a.getDate()),e=new Date(s);
 if(m==='giorno'){}
 else if(m==='settimana'){s.setDate(s.getDate()-(s.getDay()+6)%7);e.setTime(s.getTime());e.setDate(s.getDate()+6)}
 else if(m==='mese'){s.setDate(1);e.setTime(new Date(s.getFullYear(),s.getMonth()+1,0).getTime())}
 else{s.setMonth(0,1);e.setTime(new Date(s.getFullYear(),11,31).getTime())}

const lab=(m,s,e)=>m==='giorno'?s.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):m==='mese'?s.toLocaleDateString('it-IT',{month:'long',year:'numeric'}):m==='anno'?String(s.getFullYear()):`${s.toLocaleDateString('it-IT',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})}`;
function tot(s,e){const a=iso(s),b=iso(e),t={n:0,c:0,pos:0,sat:0,rep:{}};
 for(const d in db.days){if(d<a||d>b)continue;const r=db.days[d];t.n++;t.c+=r.c||0;t.pos+=r.pos||0;t.sat+=r.sat||0;
  for(const k in r.rep||{})t.rep[k]=(t.rep[k]||0)+(r.rep[k]||0)}return t}
const sumRep=t=>Object.values(t.rep).reduce((a,b)=>a+b,0);
// Media per chiusura: importo diviso per le chiusure registrate; senza chiusure non c'è media (null)
const media=(x,n)=>{if(!(n>0))return null;const k=Math.round((x||0)*100),m=Math.round(Math.abs(k)/n)/100;return k<0?-m:m};
// Variazione % rispetto all'anno prima; se l'anno prima è zero non si può calcolare (null)
const varp=(a,b)=>{a=c2(a);b=c2(b);if(b===0)return null;const v=Math.round((a-b)/Math.abs(b)*1000)/10;return v===0?0:v};
const pct=v=>v==null?'—':(v>0?'+':v<0?'−':'')+Math.abs(v).toLocaleString('it-IT',Math.abs(v)<100?{minimumFractionDigits:1,maximumFractionDigits:1}:{maximumFractionDigits:0})+'%';

// ---- Grafico: totale incassato per giorno (settimana/mese) o per mese (anno), periodo contro anno prima ----
function serie(m,s,e,n){const a=iso(s),b=iso(e),v=Array(n).fill(0);
 for(const d in db.days){if(d<a||d>b)continue;const r=db.days[d],y=+d.slice(0,4),mo=+d.slice(5,7)-1,g=+d.slice(8,10);
  const i=m==='anno'?mo:m==='mese'?g-1:Math.round((new Date(y,mo,g)-s)/864e5);
  if(i>=0&&i<n)v[i]=Math.round((v[i]+(r.c||0)+(r.pos||0)+(r.sat||0))*100)/100}
 return v}
function bLab(m,s,e,i){if(m==='anno')return new Date(s.getFullYear(),i,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
 const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);
 return d>e?null:d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
const kfmt=v=>v>=1000?(v/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k':v.toLocaleString('it-IT',{maximumFractionDigits:0});
function grafico(m,s,e,ps,pe){
 const n=m==='anno'?12:m==='mese'?Math.max(e.getDate(),pe.getDate()):7;
 const a=serie(m,s,e,n),p=serie(m,ps,pe,n);
 chart={a,p,la:a.map((_,i)=>bLab(m,s,e,i)),lp:p.map((_,i)=>bLab(m,ps,pe,i)),ta:a.reduce((x,y)=>x+y,0),tp:p.reduce((x,y)=>x+y,0)};
 const max=Math.max(0,...a,...p),W=340,H=170,L=34,R=4,T=8,B=20,pw=W-L-R,ph=H-T-B,gw=pw/n;
 let step=1,top=1;
 if(max>0){const raw=max/3,pow=Math.pow(10,Math.floor(Math.log10(raw)));step=[1,2,2.5,5,10].find(k=>k*pow>=raw)*pow;top=Math.ceil(max/step-1e-9)*step}
 const y=v=>T+ph-Math.max(0,v)/top*ph,f=x=>x.toFixed(1);
 let g='';
 if(max>0)for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${f(y(v))}" y2="${f(y(v))}"/><text x="${L-5}" y="${f(y(v)+3)}" text-anchor="end">${kfmt(v)}</text>`;
 else g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/>`;
 const bw=Math.max(1,gw*0.36),xl=m==='settimana'?['L','M','M','G','V','S','D']:m==='anno'?['G','F','M','A','M','G','L','A','S','O','N','D']:null;
 for(let i=0;i<n;i++){const x0=L+i*gw;
  g+=`<rect class="hit${i===selB?' sel':''}" data-b="${i}" x="${f(x0)}" y="${T}" width="${f(gw)}" height="${ph+B}" rx="3"/>`;
  if(p[i]>0)g+=`<rect class="b0" x="${f(x0+gw*.12)}" y="${f(y(p[i]))}" width="${f(bw)}" height="${f(T+ph-y(p[i]))}" rx="${f(Math.min(2,bw/2))}" style="animation-delay:${i*18}ms" pointer-events="none"/>`;
  if(a[i]>0)g+=`<rect class="b1" x="${f(x0+gw*.52)}" y="${f(y(a[i]))}" width="${f(bw)}" height="${f(T+ph-y(a[i]))}" rx="${f(Math.min(2,bw/2))}" style="animation-delay:${i*18+60}ms" pointer-events="none"/>`;
  const t=xl?xl[i]:([0,4,9,14,19,24,29].includes(i)?String(i+1):'');
  if(t)g+=`<text x="${f(x0+gw/2)}" y="${H-5}" text-anchor="middle" pointer-events="none">${t}</text>`}
 const yr=m==='settimana'?'':` (${s.getFullYear()} / ${ps.getFullYear()})`;
 return `<div class="card ch"><div class="lg"><span><i class="s1"></i>Periodo</span><span><i class="s0"></i>Anno prima</span></div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico del totale incassato: periodo e anno prima${yr}"><defs><linearGradient id="gb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d2ff"/><stop offset="1" stop-color="#4f97e6"/></linearGradient></defs>${g}</svg>

function chInfo(){const c=chart;if(!c)return'';

  if(!c.ta&&!c.tp)return 'Nessun incasso registrato in questi periodi.';
  return `Totale incassato: <b>${eur(c.ta)}</b> · anno prima <b>${eur(c.tp)}</b><br><span class="noprint">Tocca una barra per vedere il dettaglio.</span>`}

// ---- Vista Giorno: barre orizzontali per reparto, giorno contro stesso giorno della settimana dell'anno prima ----
function barreRep(t,p,names,lp){
 const v=names.map(n=>[n,c2(t.rep[n]),c2(p.rep[n])]).filter(x=>x[1]||x[2]);
 if(!v.length)return `<div class="card hbr"><p class="mute" style="margin:0">Nessun incasso per reparto registrato in questi giorni.</p></div>`;
 // valori negativi: nessuna barra, l'importo resta scritto
 const max=Math.max(0,...v.flatMap(x=>[x[1],x[2]])),w=x=>max>0&&x>0?`calc((100% - 92px) * ${(x/max).toFixed(4)})`:'0px';
 return `<div class="card hbr"><div class="lg" style="margin:0 0 4px;flex-wrap:wrap"><span><i class="s1"></i>Giorno</span><span><i class="s0"></i>Anno prima (${lp})</span></div>
 ${v.map(([n,a,b],i)=>`<div class="hr"><div class="hn"><span>${esc(n)}</span><b>${eur(a)}</b></div>
 <div class="hb"><i class="b1" style="width:${w(a)};animation-delay:${i*40+60}ms"></i></div>
 <div class="hb"><i class="b0" style="width:${w(b)};animation-delay:${i*40}ms"></i><small>${eur(b)}</small></div></div>`).join('')}</div>`}

// Riaprendo l'app (anche rimasta aperta in sottofondo) nel giorno dopo, la data torna a oggi
const nuovoGiorno=()=>{const t=oggi();if(t===todayK)return;todayK=t;cur=t;anchor=oggiD();if(view!=='impostazioni')render()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')nuovoGiorno()});
addEventListener('pageshow',nuovoGiorno);addEventListener('focus',nuovoGiorno);
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}});
$('#app').addEventListener('animationend',e=>{if(e.target.id==='app')e.target.classList.remove('enter')});
const A=$('#app');
A.addEventListener('input',e=>{const t=e.target;if(t.inputMode==='decimal'){const c=clean(/paste|Replacement|Drop/i.test(e.inputType||'')?pasted(t.value):t.value);if(c!==t.value)t.value=c}if(view==='chiusura'&&t.id!=='d')calc()});
A.addEventListener('change',e=>{const t=e.target;
 if(t.id==='d'){cur=t.value||cur;render()}
 else if(t.inputMode==='decimal'){t.value=/\d/.test(t.value)?fi(num(t.value)):'';calc()}
 else if(t.dataset.n!==undefined){const o=t.dataset.n,n=t.value.trim();
  if(!n||(n!==o&&db.reparti.includes(n))){t.value=o;return}
  if(n!==o&&hasData(n)&&!confirm(`«${n}» è un reparto eliminato con importi già registrati.\n\nOK = riattivalo con il suo storico: gli importi di «${o}» vengono aggiunti ai suoi.\nAnnulla = scegli un altro nome.`)){t.value=o;return}
  db.reparti[db.reparti.indexOf(o)]=n;
  // sposta gli importi; se nello stesso giorno c'è già il nome nuovo, li somma (nessun importo viene perso)
  for(const d in db.days){const r=db.days[d].rep;if(r&&o in r&&n!==o){r[n]=n in r?c2((r[n]||0)+(r[o]||0)):r[o];delete r[o]}}
  save();render()}
 else if(t.id==='imp'&&t.files[0]){const fr=new FileReader();
  fr.onload=()=>{try{const x=JSON.parse(fr.result);if(!x.days||!x.reparti)throw 0;
   if(confirm('Sostituire i dati attuali con quelli del backup?')){db=x;const ok=save();render();if(ok)toast('Backup ripristinato')}}catch(_){alert('File di backup non valido.')}};
  fr.readAsText(t.files[0])}});
A.addEventListener('click',e=>{const h=e.target.closest('[data-b]');
 if(h){const i=+h.dataset.b;selB=selB===i?-1:i;document.querySelectorAll('.hit').forEach(r=>r.classList.toggle('sel',+r.dataset.b===selB));$('#ci').innerHTML=chInfo();return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset,id=b.id;
 if(id==='save'){const r=read();
  if(!r.c&&!r.pos&&!r.sat&&!Object.keys(r.rep).length){toast('Inserisci almeno un importo');return}
  const old=db.days[cur];
  if(old&&JSON.stringify(old)!==JSON.stringify(r)&&!confirm(`Esiste già una chiusura salvata per ${new Date(cur+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}.\n\nSostituirla con questi importi?`))return;
  db.days[cur]=r;db.fondo=r.f;if(!save()){render();return}hap();toast('Chiusura salvata ✓');render()}
 else if(id==='tg'){cfOpen=!cfOpen;b.setAttribute('aria-expanded',cfOpen);const c=$('#cf');c.classList.toggle('open',cfOpen);c.inert=!cfOpen}
 else if(id==='del'){if(confirm('Eliminare la chiusura del '+cur+'?')){delete db.days[cur];if(!save()){render();return}hap();render();toast('Chiusura eliminata')}}
 else if(d.m){mode=d.m;render()}
 else if(d.s){const k=+d.s,a=new Date(anchor);
  if(mode==='giorno')a.setDate(a.getDate()+k);else if(mode==='settimana')a.setDate(a.getDate()+7*k);else if(mode==='mese'){a.setDate(1);a.setMonth(a.getMonth()+k)}else{const g=a.getDate();a.setDate(1);a.setFullYear(a.getFullYear()+k);a.setDate(Math.min(g,new Date(a.getFullYear(),a.getMonth()+1,0).getDate()))}
  anchor=a;render()}
 else if(d.edit){cur=d.edit;view='chiusura';render()}
 else if(id==='print')print();
 else if(id==='rep'){repY=anchor.getFullYear();view='report';render()}
 else if(id==='back'){view='riepilogo';render()}
 else if(d.y){repY+=+d.y;render()}
 else if(id==='rcsv')rcsv();
 else if(id==='csv')csv();
 else if(id==='add'){const n=$('#nn').value.trim();if(n&&!db.reparti.includes(n)){
  if(hasData(n)&&!confirm(`«${n}» è un reparto eliminato con importi già registrati.\n\nOK = riattivalo con il suo storico.\nAnnulla = scegli un altro nome.`))return;
  db.reparti.push(n);save();render()}}
 else if(d.x!==undefined){if(confirm('Eliminare il reparto "'+d.x+'"? I dati già registrati restano nei totali.')){db.reparti=db.reparti.filter(n=>n!==d.x);save();render()}}
 else if(id==='bk')saveFile(`backup-tabby-${iso(new Date())}.json`,'application/json',JSON.stringify(db))});
render();
</script>
</body>
</html>
