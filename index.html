*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* casse-v46: lo sfondo arriva anche sotto la Dynamic Island / barra di stato (su iPhone gli elementi fissi con inset:0 si fermavano sotto la barra) */

body{margin:0;color:var(--ink);font:17px/1.4 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

main{max-width:560px;margin:0 auto;padding:0 16px 24px;min-height:calc(100vh + 1px);min-height:calc(100lvh + 1px)}
/* ogni pagina scorre (anche Impostazioni, corta): su iPhone la barra in basso resta ferma e mantiene l'effetto vetro */
main.enter{animation:in .38s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:22px 2px 14px;color:var(--ink)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:12.5px;margin:24px 6px 8px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 46px),var(--card);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:0;border-radius:var(--r);padding:2px 16px;box-shadow:var(--glass)}
.pad{padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);margin:0;width:100%}
.card>.row:last-child,.card>div:last-child .row:last-child{border-bottom:0}
.row input{width:46%;text-align:right;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--ink);padding:5px 8px;border-radius:10px;outline:0;transition:background .2s,box-shadow .2s}
.row input::placeholder{color:rgba(225,212,187,.30);font-weight:400}
.row input:focus{background:rgba(217,182,115,.1);box-shadow:inset 0 0 0 1.5px rgba(217,182,115,.55)}
.row input.l{text-align:left;width:62%;font-weight:400}
.sub span{color:var(--mute);padding-left:14px}

<script>
const K='tabacchi.v1',$=s=>document.querySelector(s);
const c2=x=>Math.round((x||0)*100)/100;
// Importo con punto delle migliaia sempre presente (anche 1.234,56) e 2 decimali; ng = segno meno da usare
const grp=(x,ng='−')=>{x=c2(x);const[i,d]=Math.abs(x).toFixed(2).split('.');return(x<0?ng:'')+i.replace(/\B(?=(\d{3})+$)/g,'.')+','+d};
const eur=n=>grp(n)+' €';
// Importo grande: centesimi e simbolo € più piccoli
const bigEur=n=>{const s=grp(n),k=s.length-3;return `<span class="bn${k>7?' l2':k>6?' l1':''}">${s.slice(0,k)}<small>${s.slice(k)} €</small></span>`};
// Il punto è separatore delle migliaia; ma se c'è un solo punto seguito da 1 o 2 cifre (es. 12.50, tastiera col punto) è il decimale
const num=s=>{s=String(s).trim();const n=parseFloat(/^-?\d*\.\d{1,2}$/.test(s)?s:s.replace(/\./g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*100)/100};
// Testo incollato con punto e virgola insieme: l'ultimo dei due è il decimale (1,234.56 e 1.234,56 = 1234,56)
const pasted=v=>{const p=v.lastIndexOf('.'),c=v.lastIndexOf(',');return p>=0&&c>=0&&p>c?v.replace(/,/g,'').replace(/\.(?=[^.]*$)/,',').replace(/\./g,''):v};
const fi=n=>n==null||n===''?'':grp(n,'-');
const clean=v=>{v=v.replace(/[^0-9.,-]/g,'');const neg=v[0]==='-',i=v.indexOf(','),a=(i<0?v:v.slice(0,i)).replace(/-/g,'');return(neg?'-':'')+a+(i<0?'':','+v.slice(i+1).replace(/[.,-]/g,'').slice(0,2))};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function spese(s,e){const fine=new Date(todayK.slice(0,4),+todayK.slice(5,7),0);let sf=0,sfl=0,so=0,sol=0;

  const chiudi=()=>{sf=c2(sf+Math.round(qn*100)/100);sfl=c2(sfl+Math.round(ql*100)/100);qn=0;ql=0};
